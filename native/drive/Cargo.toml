[package]
name = "folder-locker-drive"
description = "Mounts Folder Locker drive vaults as a Windows drive (Dokany)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "folder_locker_drive"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
flk-vault2 = { path = "../vault2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
dokan = "0.3"
widestring = "0.4"
winapi = { version = "0.3", features = ["ntstatus", "winnt", "fileapi", "minwinbase", "libloaderapi", "errhandlingapi", "winerror"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "0.3", features = ["shellapi", "combaseapi", "objbase"] }
