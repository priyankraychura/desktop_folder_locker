name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  checks:
    name: Analyze and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # Inno Setup's preprocessor takes any line that starts with "#" as a
      # directive, so a Pascal "#13#10" must never start a line. And Inno
      # Setup takes any line that starts with "[" as a section, even in a
      # comment in [Code].
      - name: Check the installer script
        run: |
          if grep -HnE '^\s*#[0-9$]' installer/*.iss; then
            echo "A line in the installer script starts with a character code"
            exit 1
          fi
          if grep -HnE '^\s*\[' installer/*.iss | grep -vE '^[^:]+:[0-9]+:\[[A-Za-z]+\]\s*$'; then
            echo "A line in the installer script starts with [ but is no section"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Lint Rust
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The vault core, the helper's protocol, import and export. Also
      # builds the helper that the app's tests below talk to.
      - name: Test Rust
        working-directory: native
        run: cargo test --workspace

      # The first run also compiles libsodium from source (build hook).
      - name: Test
        run: flutter test

  windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # Also compiles Dokany's user-mode library from source, only to link
      # against it; the helper uses the one Dokany installs.
      - name: Lint the native parts
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The release build, as it ships: its COM objects, then end to end,
      # registered for Explorer and shown and run by Windows' own menu code.
      - name: Test the Explorer plug-in
        working-directory: native
        env:
          FLK_SHELL_E2E: '1'
          RUST_BACKTRACE: '1'
        run: cargo test --release -p folder-locker-shell -- --nocapture

      - name: Build the drive helper and the Explorer plug-in
        working-directory: native
        run: cargo build --release -p folder-locker-drive -p folder-locker-shell

      # Also exercises the Windows code paths of the engine (NTFS renames,
      # file attributes and free-space checks through FFI) and the app
      # talking to the drive helper built above.
      - name: Test
        run: flutter test

      - name: Build app
        run: flutter build windows --release

      # Flutter apps need the Visual C++ runtime. Shipping these three DLLs
      # next to the exe (as the Flutter docs suggest) means users don't have
      # to install the redistributable. Dokany's installer goes along too, so
      # Setup and the app can install it.
      - name: Bundle the Visual C++ runtime, the native parts and Dokany
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          foreach ($file in 'folder_locker_drive.exe', 'folder_locker_shell.dll') {
            Copy-Item "native\target\release\$file" $release
          }
          & .\installer\get-dokany.ps1 -Destination "$release\dokany"
          Get-ChildItem -Recurse $release -File | Select-Object Length, FullName

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\folder_locker.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installs for all users as a user would (Dokany included, as it's not
      # on this machine yet), checks the result, and uninstalls again.
      - name: Test the installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build\installer\*.exe | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $process = Start-Process $setup -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', "/LOG=`"$log`""
          if ($process.ExitCode -ne 0) {
            Get-Content $log -Tail 80
            throw "Setup failed with $($process.ExitCode)"
          }
          $app = Join-Path $env:ProgramFiles 'Folder Locker'
          foreach ($file in 'folder_locker.exe', 'folder_locker_drive.exe', 'folder_locker_shell.dll', 'lock_badge.ico', 'dokany\Dokan_x64.msi') {
            if (-not (Test-Path (Join-Path $app $file))) { throw "$file was not installed" }
          }
          if (-not (Test-Path "$env:WINDIR\System32\dokan2.dll")) {
            Get-Content $log -Tail 80
            throw 'Setup did not install Dokany'
          }
          # The Explorer plug-in's entry (native/shell/tests/explorer.rs
          # tests it in Explorer's menu).
          $clsid = '{3C1C048E-1C62-4B0B-87AC-55EDAD0E97BB}'
          $classes = 'HKCU:\Software\Classes'
          $server = (Get-ItemProperty "$classes\CLSID\$clsid\InprocServer32").'(default)'
          if ($server -ne (Join-Path $app 'folder_locker_shell.dll')) { throw "Unexpected plug-in: $server" }
          foreach ($target in 'Directory', '*', 'Drive') {
            $handler = (Get-ItemProperty -LiteralPath "$classes\$target\shell\FolderLocker.Lock").ExplorerCommandHandler
            if ($handler -ne $clsid) { throw "No plug-in entry on $target" }
          }
          if (Test-Path "$classes\Directory\shell\FolderLocker.Lock\command") {
            throw 'The plain entry is still there'
          }
          $open = (Get-ItemProperty "$classes\FolderLocker.Vault\shell\open\command").'(default)'
          if ($open -notlike "*$app*") { throw "Unexpected vault command: $open" }
          # The lock badge, for all users (native/shell/tests/badge.rs tests
          # it in Explorer's overlay code).
          $badge = '{38F771FD-E77E-4105-A560-9E02A7B507D5}'
          $overlay = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\ FolderLocker'
          if ((Get-ItemProperty -LiteralPath $overlay).'(default)' -ne $badge) { throw 'The lock badge is not registered' }
          $server = (Get-ItemProperty "HKLM:\Software\Classes\CLSID\$badge\InprocServer32").'(default)'
          if ($server -ne (Join-Path $app 'folder_locker_shell.dll')) { throw "Unexpected badge: $server" }

          # The installed helper finds the Dokany that Setup installed.
          $start = [System.Diagnostics.ProcessStartInfo]::new((Join-Path $app 'folder_locker_drive.exe'))
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $helper = [System.Diagnostics.Process]::Start($start)
          $helper.StandardInput.WriteLine('{"id":1,"cmd":"hello"}')
          $helper.StandardInput.Close()
          $reply = $helper.StandardOutput.ReadToEnd()
          $helper.WaitForExit()
          Write-Host $reply
          if (($reply | ConvertFrom-Json).result.dokany.installed -ne $true) {
            throw 'The helper does not find Dokany'
          }

          # The uninstaller goes on from a copy of itself: wait for it.
          Start-Process (Join-Path $app 'unins000.exe') -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path (Join-Path $app 'folder_locker.exe')) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $app 'folder_locker.exe')) { throw 'The app was not removed' }
          foreach ($key in 'Directory\shell\FolderLocker.Lock', 'Drive\shell\FolderLocker.Lock', "CLSID\$clsid", 'FolderLocker.Vault') {
            if (Test-Path -LiteralPath "$classes\$key") { throw "$key was not removed" }
          }
          foreach ($key in $overlay, "HKLM:\Software\Classes\CLSID\$badge") {
            if (Test-Path -LiteralPath $key) { throw "$key was not removed" }
          }
          if (-not (Test-Path "$env:WINDIR\System32\dokan2.dll")) {
            throw 'Dokany should stay installed'
          }

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: folder-locker-setup
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Upload app folder
        uses: actions/upload-artifact@v5
        with:
          name: folder-locker-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  drive:
    name: Drive end to end (Windows, Dokany)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # The same Dokany that the installer ships.
      - name: Install Dokany
        shell: pwsh
        run: |
          $msi = & .\installer\get-dokany.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'dokany')
          $log = Join-Path $env:RUNNER_TEMP 'dokany.log'
          Write-Host "Installing $msi"
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Get-Content $log -Tail 80
            exit $process.ExitCode
          }
          Get-Item "$env:WINDIR\System32\dokan2.dll"

      # Mounts a vault, uses the drive like any other, mounts it again.
      - name: Test the drive helper
        working-directory: native
        env:
          FLK_REQUIRE_DOKANY: '1'
          RUST_BACKTRACE: '1'
        run: cargo test --workspace -- --nocapture
