name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  checks:
    name: Analyze and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # The first run also compiles libsodium from source (build hook).
      - name: Test
        run: flutter test

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Lint Rust
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The vault core, the helper's protocol, import and export.
      - name: Test Rust
        working-directory: native
        run: cargo test --workspace

  windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      # Also exercises the Windows code paths of the engine: NTFS renames,
      # file attributes and free-space checks through FFI.
      - name: Test
        run: flutter test

      - name: Build app
        run: flutter build windows --release

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # Also compiles Dokany's user-mode library from source, only to link
      # against it; the helper uses the one Dokany installs.
      - name: Lint and build the drive helper
        working-directory: native
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --release -p folder-locker-drive

      # Flutter apps need the Visual C++ runtime. Shipping these three DLLs
      # next to the exe (as the Flutter docs suggest) means users don't have
      # to install the redistributable.
      - name: Bundle the Visual C++ runtime and the drive helper
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          Copy-Item native\target\release\folder_locker_drive.exe $release
          Get-ChildItem $release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\folder_locker.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: folder-locker-setup
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Upload app folder
        uses: actions/upload-artifact@v5
        with:
          name: folder-locker-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  drive:
    name: Drive end to end (Windows, Dokany)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # The latest Dokany release, as users get it.
      - name: Install Dokany
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dokany'
          gh release download --repo dokan-dev/dokany --pattern '*x64*.msi' --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = (Get-ChildItem $dir -Filter *.msi | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'dokany.log'
          Write-Host "Installing $msi"
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Get-Content $log -Tail 80
            exit $process.ExitCode
          }
          Get-Item "$env:WINDIR\System32\dokan2.dll"

      # Mounts a vault, uses the drive like any other, mounts it again.
      - name: Test the drive helper
        working-directory: native
        env:
          FLK_REQUIRE_DOKANY: '1'
          RUST_BACKTRACE: '1'
        run: cargo test --workspace -- --nocapture
